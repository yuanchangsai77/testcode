[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexcli"
version = "0.1.0"
description = "An LLM-driven CLI workbench scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
codexcli = "codexcli.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
